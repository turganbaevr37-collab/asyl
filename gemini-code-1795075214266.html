<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жандарбеков Асыл — Лига Чемпионы | Портфолио</title>
    <style>
        :root {
            --bg-dark: #070b14;
            --bg-card: rgba(17, 25, 40, 0.78);
            --bg-card-hover: rgba(25, 37, 58, 0.92);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --cyan: #38bdf8;
            --emerald: #34d399;
            --gold: #fbbf24;
            --border-subtle: rgba(148, 163, 184, 0.16);
            --border-gold: rgba(251, 191, 36, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.16), transparent 40%),
                radial-gradient(circle at 85% 20%, rgba(251, 191, 36, 0.12), transparent 38%),
                radial-gradient(circle at 50% 85%, rgba(52, 211, 153, 0.10), transparent 45%);
            color: var(--text-primary);
            line-height: 1.65;
            min-height: 100vh;
        }

        /* Навигация */
        nav {
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            background: rgba(7, 11, 20, 0.72);
            border-bottom: 1px solid var(--border-subtle);
        }

        .nav-inner {
            max-width: 960px;
            margin: 0 auto;
            padding: 0.9rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .brand {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.02em;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--cyan));
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.7);
        }

        .nav-links {
            display: flex;
            gap: 1.25rem;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--cyan);
        }

        /* Басты бөлім (Hero) */
        header.hero {
            max-width: 960px;
            margin: 0 auto;
            padding: 4rem 1.5rem 2.5rem;
            text-align: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.4rem 0.95rem;
            border-radius: 999px;
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid var(--border-gold);
            color: var(--gold);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 24px rgba(251, 191, 36, 0.12);
        }

        .avatar-wrap {
            position: relative;
            width: 112px;
            height: 112px;
            margin: 0 auto 1.5rem;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--cyan), #2563eb, var(--gold));
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 35px rgba(56, 189, 248, 0.25);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #0b1220;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.1rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: 0.04em;
        }

        h1 {
            font-size: clamp(2.1rem, 5vw, 3.2rem);
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.03em;
            margin-bottom: 0.85rem;
            background: linear-gradient(90deg, #ffffff 10%, var(--cyan) 55%, var(--gold) 95%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            max-width: 640px;
            margin: 0 auto 1.75rem;
            color: var(--text-secondary);
            font-size: 1.08rem;
        }

        .cta-row {
            display: flex;
            justify-content: center;
            gap: 0.9rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.75rem 1.4rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold), #f59e0b);
            color: #090d16;
            box-shadow: 0 8px 24px rgba(251, 191, 36, 0.28);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(251, 191, 36, 0.38);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.1);
        }

        /* Негізгі бөлімдер */
        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 1rem 1.5rem 4rem;
            display: grid;
            gap: 1.75rem;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 2rem;
            transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(56, 189, 248, 0.35);
            background: var(--bg-card-hover);
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.15rem;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .profile-text {
            color: var(--text-secondary);
            font-size: 1.05rem;
        }

        .stats-strip {
            margin-top: 1.5rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .stat-box {
            background: rgba(7, 11, 20, 0.55);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 1rem;
            text-align: center;
        }

        .stat-value {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--cyan);
            margin-bottom: 0.2rem;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .hobbies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.25rem;
        }

        .hobby-card {
            background: rgba(7, 11, 20, 0.55);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 1.5rem;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .hobby-card:hover {
            transform: translateY(-3px);
            border-color: rgba(52, 211, 153,
